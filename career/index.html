<!doctype html>
<!-- 就活用のページ(decisions タスク 5)。いつもライトで開くため data-theme="light" を固定で書く。
     最初の一色(src/fx/blockFx.js と head の差し込みスクリプト)も、この指定を見て白になる。 -->
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 本体からはリンクしないが、検索には出す(確認シート17回目 R17-5。名前で探した人が見つけられるように)。
         説明は自己紹介の1段落目(確認シート16回目で決まった文)。サイトマップにも載せる -->
    <title>プロフィール | 日野岡雅人</title>
    <meta name="description" content="筑波大学大学院 情報学学位プログラム（博士前期課程）に在籍し、2028年3月に修了予定です。メタデータ研究室で、Web 上で公開されたつながりのあるデータ（Linked Open Data）を、問い合わせ言語の SPARQL で使いやすくする手法を研究しています。個人では Web アプリやツールを作っています。" />
    <link rel="canonical" href="https://fuyuiro.pages.dev/career/">
    <meta property="og:title" content="プロフィール | 日野岡雅人">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://fuyuiro.pages.dev/career/">
    <meta property="og:image" content="https://fuyuiro.pages.dev/icons/og-image.png">

    <!-- 構造化データと、検索エンジン向けの中身は、ビルドのときに入れる(vite.config.js の careerSeoPlugin) -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="shortcut icon" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- いつもライトで開くので、ブラウザの枠の色もライトだけ -->
    <meta name="theme-color" content="#F9EC8E">

    <!-- 初回ペイントの地の色(CSS の読み込みを待たずに、本体と同じ黄色にする) -->
    <style>
      html { background-color: #F9EC8E; }
    </style>

    <!-- テーマ切り替えボタンの見た目(本体と共通) -->
    <link rel="stylesheet" href="/header-styles.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/career-main.jsx"></script>
  </body>
</html>
