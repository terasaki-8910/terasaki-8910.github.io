<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spotify Dashboard - クソサイト製造工場">
    <title>Spotify Dashboard | クソサイト製造工場</title>
    <link rel="canonical" href="https://terasaki-8910.github.io/spotify/">
    <meta name="theme-color" content="#F9EC8E" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="shortcut icon" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- 共有ヘッダーCSS -->
    <link rel="stylesheet" href="/header-styles.css">
    <style>
        @font-face {
            font-family: 'Craft Mincho';
            src: url('/fonts/craft-mincho.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Fira Mono';
            src: url('/fonts/fira-mono-400.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Zen Kurenaido';
            src: url('/fonts/zen-kurenaido.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-paper: #F9EC8E;
            --color-surface: #E6E6E6;
            --color-ink: #1A1A1A;
            --color-muted: #696969;
            --color-line: rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-paper: #121212;
                --color-surface: #1D1D1D;
                --color-ink: #EDEDED;
                --color-muted: #8F8F8F;
                --color-line: rgba(255, 255, 255, 0.12);
            }
        }

        :root[data-theme="dark"] {
            --color-paper: #121212;
            --color-surface: #1D1D1D;
            --color-ink: #EDEDED;
            --color-muted: #8F8F8F;
            --color-line: rgba(255, 255, 255, 0.12);
        }

        :root[data-theme="light"] {
            --color-paper: #F9EC8E;
            --color-surface: #E6E6E6;
            --color-ink: #1A1A1A;
            --color-muted: #696969;
            --color-line: rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Zen Kurenaido', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-paper);
            min-height: 100vh;
            color: var(--color-ink);
            overflow-x: hidden;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 100px 2rem 4rem;
        }

        .header {
            margin-bottom: 3rem;
        }

        .title {
            font-family: 'Craft Mincho', 'Hiragino Mincho ProN', serif;
            font-size: 3rem;
            font-weight: 400;
            color: var(--color-ink);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--color-muted);
            font-size: 1.1rem;
        }

        .tracks-wrapper {
            border-top: 1px solid var(--color-line);
        }

        .track-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--color-line);
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            text-align: left;
            cursor: pointer;
            color: inherit;
            font: inherit;
        }

        .album-art-container {
            position: relative;
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }

        .album-art {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            -o-object-fit: cover;
               object-fit: cover;
            display: block;
        }

        .play-button {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease, background-color 0.2s ease;
            pointer-events: none;
        }

        .track-card:hover .play-button {
            opacity: 1;
            background: rgba(0, 0, 0, 0.3);
        }

        .play-icon {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 0.95rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.2s ease;
        }

        .track-card:hover .track-name {
            color: #4E8C72;
        }

        .track-artist {
            color: var(--color-muted);
            font-size: 0.8rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 0.2rem;
        }

        .track-meta {
            flex-shrink: 0;
            text-align: right;
            font-family: 'Fira Mono', 'SF Mono', Menlo, monospace;
            font-size: 0.75rem;
            color: var(--color-muted);
        }

        /* Spotify iFrame Container */
        #spotify-iframe-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 380px;
            z-index: 1000;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        #embed-iframe {
            width: 100%;
            height: 100%;
        }

        #spotify-iframe-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            cursor: pointer;
            z-index: 10;
            font-size: 14px;
        }

        .loading,
        .error {
            padding: 3rem 0;
            color: var(--color-muted);
        }

        .last-updated {
            margin-top: 2rem;
            color: var(--color-muted);
            font-size: 0.85rem;
            font-family: 'Fira Mono', 'SF Mono', Menlo, monospace;
        }

        @media (max-width: 768px) {
            .container {
                padding: 80px 1.5rem 3rem;
            }

            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <header class="cosmic-header">
    <div class="cosmic-header__container">

    </a>
    <div class="cosmic-header__right-group">
    <button
            type="button"
            id="theme-toggle-btn"
            class="cosmic-header__theme-toggle"
            aria-label="ダーク/ライトモード切り替え"
          >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="cosmic-header__icon cosmic-header__icon--sun">
    <circle cx="12" cy="12" r="5" />
    <line x1="12" y1="1" x2="12" y2="3" />
    <line x1="12" y1="21" x2="12" y2="23" />
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
    <line x1="1" y1="12" x2="3" y2="12" />
    <line x1="21" y1="12" x2="23" y2="12" />
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="cosmic-header__icon cosmic-header__icon--moon">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    </button>
    <a
            href="/spotify/"
            class="cosmic-header__spotify-link cosmic-header__spotify-link--active"
            aria-label="Spotify Dashboard"
          >
    <div class="cosmic-header__spotify-box">
    <div class="cosmic-header__spotify-icon">
    <svg viewBox="0 0 24 24" fill="currentColor" class="spotify-logo">
    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
    </svg>
    </div>
    <span class="cosmic-header__spotify-text">Spotify Dashboard</span>
    </div>
    </a>
    </div>
    </div>
    </header>



















































    <div class="container">

        <div class="header">
            <h1 class="title">最近再生した曲</h1>
            <p class="subtitle">Spotifyで最近聴いた曲たち</p>
        </div>

        <div id="loading" class="loading">
            <p>読み込み中...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>データの読み込みに失敗しました</p>
        </div>

        <div id="content" style="display: none;">
            <div id="tracks-wrapper" class="tracks-wrapper">
                <!-- トラックがここに挿入されます -->
            </div>
            <div id="last-updated" class="last-updated"></div>
        </div>
    </div>

    <!-- Spotify iFrame Container -->
    <div id="spotify-iframe-container">
        <button id="spotify-iframe-close" aria-label="閉じる">✕</button>
        <div id="embed-iframe"></div>
    </div>

    <!-- Spotify iFrame API -->
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script>
        // テーマ切り替え(React側のHeader.jsxと同じ考え方: localStorage優先、
        // なければprefers-color-schemeに従う)
        function getInitialTheme() {
            const saved = window.localStorage.getItem('theme');
            if (saved === 'light' || saved === 'dark') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            window.localStorage.setItem('theme', theme);
        }

        applyTheme(getInitialTheme());

        document.getElementById('theme-toggle-btn').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // Spotify iFrame用の変数
        let spotifyController = null;
        let currentPlayingTrack = null;
        let iframeApiReady = false;

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            iframeApiReady = true;

            const element = document.getElementById('embed-iframe');
            const options = {
                uri: 'spotify:track:4K8QY8eufhwEg9EEix0Qqn',
                width: '100%',
                height: '100%',
                theme: 'black'
            };

            const callback = (EmbedController) => {
                spotifyController = EmbedController;
            };

            IFrameAPI.createController(element, options, callback);
        };

        window.addEventListener('load', () => {
            loadSpotifyData();
        });

        document.getElementById('spotify-iframe-close').addEventListener('click', () => {
            hideSpotifyIframe();
            if (spotifyController) {
                spotifyController.pause();
            }
            currentPlayingTrack = null;
            document.querySelectorAll('.track-card').forEach(card => updatePlayButton(card, false));
        });

        async function loadSpotifyData() {
            try {
                const response = await fetch('/spotify-data.json');
                if (!response.ok) {
                    throw new Error('データの取得に失敗しました');
                }

                const data = await response.json();
                displayTracks(data);

            } catch (error) {
                showError();
            }
        }

        function playPreview(trackElement, track) {
            if (currentPlayingTrack === track.id) {
                if (spotifyController) {
                    spotifyController.pause();
                    hideSpotifyIframe();
                }
                currentPlayingTrack = null;
                updatePlayButton(trackElement, false);
                return;
            }

            document.querySelectorAll('.track-card').forEach(card => updatePlayButton(card, false));

            if (!iframeApiReady || !spotifyController) {
                openInSpotify(track);
                return;
            }

            try {
                const trackUri = `spotify:track:${track.id}`;
                showSpotifyIframe();

                // setTimeoutを挟むと(特にSafari/iOSで)クリック起点のユーザー操作
                // 由来という扱いが切れ、自動再生ポリシーに引っかかりやすくなるため、
                // loadUriのコールバック内で即座にplay()を呼ぶ
                spotifyController.loadUri(trackUri, () => {
                    spotifyController.play();
                    currentPlayingTrack = track.id;
                    updatePlayButton(trackElement, true);
                });

            } catch (error) {
                openInSpotify(track);
            }
        }

        function showSpotifyIframe() {
            document.getElementById('spotify-iframe-container').style.display = 'block';
        }

        function hideSpotifyIframe() {
            document.getElementById('spotify-iframe-container').style.display = 'none';
        }

        function openInSpotify(track, trackElement = null) {
            if (trackElement) {
                updatePlayButton(trackElement, false);
            }
            currentPlayingTrack = null;
            hideSpotifyIframe();
            window.open(track.spotifyUrl, '_blank');
        }

        function updatePlayButton(trackElement, isPlaying) {
            const playIcon = trackElement.querySelector('.play-icon');
            if (!playIcon) return;
            playIcon.innerHTML = isPlaying
                ? '<path d="M6 4v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1H6a1 1 0 00-1 1zm6 0v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1h-2a1 1 0 00-1 1z"/>'
                : '<path d="M8 5v14l11-7z"/>';
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatPlayedAt(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));

            if (diffHours < 1) {
                return 'たった今';
            } else if (diffHours < 24) {
                return `${diffHours}時間前`;
            } else {
                const diffDays = Math.floor(diffHours / 24);
                return `${diffDays}日前`;
            }
        }

        function displayTracks(data) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const wrapper = document.getElementById('tracks-wrapper');
            const lastUpdated = document.getElementById('last-updated');

            loading.style.display = 'none';
            content.style.display = 'block';

            if (!data.tracks || data.tracks.length === 0) {
                wrapper.innerHTML = '<p class="loading">再生履歴がありません</p>';
                return;
            }

            wrapper.innerHTML = data.tracks.map(track => `
                <button type="button" class="track-card" data-track='${JSON.stringify(track)}'>
                    <div class="album-art-container">
                        <img src="${track.albumArt}" alt="${track.name}" class="album-art"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22%3E%3Crect width=%2256%22 height=%2256%22 fill=%22%23E6E6E6%22/%3E%3C/svg%3E'">
                        <div class="play-button">
                            <svg class="play-icon" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-artist">${track.artist} — ${track.album}</div>
                    </div>
                    <div class="track-meta">
                        <div>${formatTime(track.duration)}</div>
                        <div>${formatPlayedAt(track.playedAt)}</div>
                    </div>
                </button>
            `).join('');

            document.querySelectorAll('.track-card').forEach(card => {
                card.addEventListener('click', function () {
                    const trackData = JSON.parse(this.dataset.track);
                    playPreview(this, trackData);
                });
            });

            if (data.lastUpdated) {
                const updatedDate = new Date(data.lastUpdated);
                lastUpdated.textContent = `最終更新: ${updatedDate.toLocaleString('ja-JP')}`;
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // 5分ごとに自動更新
        setInterval(loadSpotifyData, 5 * 60 * 1000);
    </script>
</body>
</html>
