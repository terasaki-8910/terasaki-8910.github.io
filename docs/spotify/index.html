    <style>
        @font-face {
            font-family: 'Craft Mincho';
            src: url('/fonts/craft-mincho.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Fira Mono';
            src: url('/fonts/fira-mono-400.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Zen Kurenaido';
            src: url('/fonts/zen-kurenaido.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-paper: #F9EC8E;
            --color-surface: #E6E6E6;
            --color-ink: #1A1A1A;
            --color-muted: #696969;
            --color-line: rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-paper: #121212;
                --color-surface: #1D1D1D;
                --color-ink: #EDEDED;
                --color-muted: #8F8F8F;
                --color-line: rgba(255, 255, 255, 0.12);
            }
        }

        :root[data-theme="dark"] {
            --color-paper: #121212;
            --color-surface: #1D1D1D;
            --color-ink: #EDEDED;
            --color-muted: #8F8F8F;
            --color-line: rgba(255, 255, 255, 0.12);
        }

        :root[data-theme="light"] {
            --color-paper: #F9EC8E;
            --color-surface: #E6E6E6;
            --color-ink: #1A1A1A;
            --color-muted: #696969;
            --color-line: rgba(0, 0, 0, 0.12);
        }

        /* 地の色は html に塗る(body に塗ると背景のマス目が隠れる。src/index.css と同じ理由) */
        html {
            background: var(--color-paper);
        }

        /* 中身のある所の背景(src/index.css の .bk-content と同じ。2026-10-04 本人指定の案 B) */
        :root {
            --bk-content-fill: color-mix(in srgb, var(--color-paper) 82%, transparent);
        }
        @supports not (color: color-mix(in srgb, red 50%, transparent)) {
            :root {
                --bk-content-fill: var(--color-paper);
            }
        }
        .bk-content {
            background-color: var(--bk-content-fill);
        }

        .icon-credit {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--color-muted);
        }

        .icon-credit a {
            color: inherit;
            text-underline-offset: 2px;
        }

        .icon-credit a:hover {
            color: var(--header-accent);
        }

        body {
            font-family: 'Zen Kurenaido', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: var(--color-ink);
            overflow-x: hidden;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 100px 2rem 4rem;
        }

        .header {
            margin-bottom: 3rem;
        }

        .title {
            font-family: 'Craft Mincho', 'Hiragino Mincho ProN', serif;
            font-size: 3rem;
            font-weight: 400;
            color: var(--color-ink);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--color-muted);
            font-size: 1.1rem;
        }

        .tracks-wrapper {
            border-top: 1px solid var(--color-line);
        }

        .track-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--color-line);
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            text-align: left;
            cursor: pointer;
            color: inherit;
            font: inherit;
        }

        .album-art-container {
            position: relative;
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }

        .album-art {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            -o-object-fit: cover;
               object-fit: cover;
            display: block;
        }

        .play-button {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease, background-color 0.2s ease;
            pointer-events: none;
        }

        .track-card:hover .play-button {
            opacity: 1;
            background: rgba(0, 0, 0, 0.3);
        }

        .play-icon {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 0.95rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.2s ease;
        }

        .track-card:hover .track-name {
            color: #4E8C72;
        }

        .track-artist {
            color: var(--color-muted);
            font-size: 0.8rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 0.2rem;
        }

        .track-meta {
            flex-shrink: 0;
            text-align: right;
            font-family: 'Fira Mono', 'SF Mono', Menlo, monospace;
            font-size: 0.75rem;
            color: var(--color-muted);
        }

        /* Spotify iFrame Container。Spotify公式の埋め込み高さは3段階
           (80=コンパクトバー/152=中間/352=フルプレイヤー+アルバム画像)。
           以前は380pxでフルプレイヤー相当だったが、場所を取りすぎるとの
           指摘でコンパクトバー(80px)に変更した(本人指定、2026-08-08)。 */
        #spotify-iframe-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 80px;
            z-index: 1000;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        #embed-iframe {
            width: 100%;
            height: 100%;
        }

        #spotify-iframe-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            cursor: pointer;
            z-index: 10;
            font-size: 14px;
        }

        .loading,
        .error {
            padding: 3rem 0;
            color: var(--color-muted);
        }

        .last-updated {
            margin-top: 2rem;
            color: var(--color-muted);
            font-size: 0.85rem;
            font-family: 'Fira Mono', 'SF Mono', Menlo, monospace;
        }

        @media (max-width: 768px) {
            .container {
                padding: 80px 1.5rem 3rem;
            }

            .title {
                font-size: 2rem;
            }
        }

    <script>
        // テーマ切り替え(React側のHeader.jsxと同じ考え方: localStorage優先、
        // なければprefers-color-schemeに従う)
        function getInitialTheme() {
            const saved = window.localStorage.getItem('theme');
            if (saved === 'light' || saved === 'dark') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            window.localStorage.setItem('theme', theme);
        }

        applyTheme(getInitialTheme());

        document.getElementById('theme-toggle-btn').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // Spotify iFrame用の変数
        let spotifyController = null;
        let currentPlayingTrack = null;
        let iframeApiReady = false;

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            iframeApiReady = true;

            const element = document.getElementById('embed-iframe');
            const options = {
                uri: 'spotify:track:4K8QY8eufhwEg9EEix0Qqn',
                width: '100%',
                height: '100%',
                theme: 'black'
            };

            const callback = (EmbedController) => {
                spotifyController = EmbedController;
            };

            IFrameAPI.createController(element, options, callback);
        };

        window.addEventListener('load', () => {
            loadSpotifyData();
        });

        document.getElementById('spotify-iframe-close').addEventListener('click', () => {
            hideSpotifyIframe();
            if (spotifyController) {
                spotifyController.pause();
            }
            currentPlayingTrack = null;
            document.querySelectorAll('.track-card').forEach(card => updatePlayButton(card, false));
        });

        async function loadSpotifyData() {
            try {
                const response = await fetch('/spotify-data.json');
                if (!response.ok) {
                    throw new Error('データの取得に失敗しました');
                }

                const data = await response.json();
                displayTracks(data);

            } catch (error) {
                showError();
            }
        }

        function playPreview(trackElement, track) {
            if (currentPlayingTrack === track.id) {
                if (spotifyController) {
                    spotifyController.pause();
                    hideSpotifyIframe();
                }
                currentPlayingTrack = null;
                updatePlayButton(trackElement, false);
                return;
            }

            document.querySelectorAll('.track-card').forEach(card => updatePlayButton(card, false));

            if (!iframeApiReady || !spotifyController) {
                openInSpotify(track);
                return;
            }

            try {
                const trackUri = `spotify:track:${track.id}`;
                showSpotifyIframe();

                // setTimeoutを挟むと(特にSafari/iOSで)クリック起点のユーザー操作
                // 由来という扱いが切れ、自動再生ポリシーに引っかかりやすくなるため、
                // loadUriのコールバック内で即座にplay()を呼ぶ
                spotifyController.loadUri(trackUri, () => {
                    spotifyController.play();
                    currentPlayingTrack = track.id;
                    updatePlayButton(trackElement, true);
                });

            } catch (error) {
                openInSpotify(track);
            }
        }

        function showSpotifyIframe() {
            document.getElementById('spotify-iframe-container').style.display = 'block';
        }

        function hideSpotifyIframe() {
            document.getElementById('spotify-iframe-container').style.display = 'none';
        }

        function openInSpotify(track, trackElement = null) {
            if (trackElement) {
                updatePlayButton(trackElement, false);
            }
            currentPlayingTrack = null;
            hideSpotifyIframe();
            window.open(track.spotifyUrl, '_blank');
        }

        function updatePlayButton(trackElement, isPlaying) {
            const playIcon = trackElement.querySelector('.play-icon');
            if (!playIcon) return;
            playIcon.innerHTML = isPlaying
                ? '<path d="M6 4v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1H6a1 1 0 00-1 1zm6 0v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1h-2a1 1 0 00-1 1z"/>'
                : '<path d="M8 5v14l11-7z"/>';
        }

        // 曲名などを HTML に入れる前に、意味を持つ文字を置き換える
        // (曲名の「'」や「<」「&」で、マークアップが途中で切れないように)
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatPlayedAt(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));

            if (diffHours < 1) {
                return 'たった今';
            } else if (diffHours < 24) {
                return `${diffHours}時間前`;
            } else {
                const diffDays = Math.floor(diffHours / 24);
                return `${diffDays}日前`;
            }
        }

        function displayTracks(data) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const wrapper = document.getElementById('tracks-wrapper');
            const lastUpdated = document.getElementById('last-updated');

            loading.style.display = 'none';
            content.style.display = 'block';

            if (!data.tracks || data.tracks.length === 0) {
                wrapper.innerHTML = '<p class="loading">再生履歴がありません</p>';
                return;
            }

            // 曲のデータは HTML の属性に書かず、何番目の曲かだけを持たせる。以前は JSON を
            // 一重引用符の属性に入れていたため、曲名に「'」があると属性が途中で切れ、
            // 押したときの JSON.parse が失敗していた(例: Hedwig's Theme)。
            wrapper.innerHTML = data.tracks.map((track, index) => `
                <button type="button" class="track-card" data-index="${index}">
                    <div class="album-art-container">
                        <img src="${escapeHtml(track.albumArt)}" alt="${escapeHtml(track.name)}" class="album-art"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22%3E%3Crect width=%2256%22 height=%2256%22 fill=%22%23E6E6E6%22/%3E%3C/svg%3E'">
                        <div class="play-button">
                            <svg class="play-icon" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="track-info">
                        <div class="track-name">${escapeHtml(track.name)}</div>
                        <div class="track-artist">${escapeHtml(track.artist)} — ${escapeHtml(track.album)}</div>
                    </div>
                    <div class="track-meta">
                        <div>${formatTime(track.duration)}</div>
                        <div>${formatPlayedAt(track.playedAt)}</div>
                    </div>
                </button>
            `).join('');

            document.querySelectorAll('.track-card').forEach(card => {
                card.addEventListener('click', function () {
                    const trackData = data.tracks[Number(this.dataset.index)];
                    playPreview(this, trackData);
                });
            });

            if (data.lastUpdated) {
                const updatedDate = new Date(data.lastUpdated);
                lastUpdated.textContent = `最終更新: ${updatedDate.toLocaleString('ja-JP')}`;
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // 5分ごとに自動更新
        setInterval(loadSpotifyData, 5 * 60 * 1000);
    </script>
    <!-- ヘッダーのメニューの開閉(React のページと同じ src/fx/projectMenu.js) -->
</body>
</html>
