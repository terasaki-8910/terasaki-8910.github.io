<!doctype html>
<!-- 就活用のページ(decisions タスク 5)。いつもライトで開くため data-theme="light" を固定で書く。
     最初の一色(src/fx/blockFx.js と head の差し込みスクリプト)も、この指定を見て白になる。 -->
<html lang="ja" data-theme="light">
  <head>
    <script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('theme-picked')}catch(e){}d.setAttribute('data-theme',t==='dark'?'dark':'light')})();</script>
    <style>html.bk-cover::before{content:"";position:fixed;inset:0;z-index:2147483647;background:var(--bk-cover,#fff)}</style>
    <script>(function(){try{var d=document.documentElement;if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;var t=d.getAttribute('data-theme')==='dark'?'dark':'light';d.style.setProperty('--bk-cover',t==='dark'?'#121212':'#FFFFFF');d.classList.add('bk-cover');setTimeout(function(){d.classList.remove('bk-cover')},3000)}catch(e){}})();</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 本体からはリンクせず、検索結果にも出さない。サイトマップにも載せない -->
