<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2em;
        }
        .code-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ff00;
        }
        .instructions {
            color: rgba(255, 255, 255, 0.9);
            margin: 20px 0;
            line-height: 1.6;
        }
        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #ffcccc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .copy-btn {
            background: #1DB954;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background 0.3s;
        }
        .copy-btn:hover {
            background: #1ed760;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="error-section" class="error" style="display: none;">
            <h1>❌ 認証エラー</h1>
            <p id="error-message"></p>
        </div>

        <div id="success-section">
            <h1>✅ 認証成功！</h1>
            <div class="instructions">
                <p><strong>認証コードをコピーしてください:</strong></p>
            </div>
            <div id="auth-code" class="code-display">
                認証コードを取得中...
            </div>
            <button class="copy-btn" onclick="copyCode()">📋 コピー</button>
            <div class="instructions">
                <p>このコードをターミナルに貼り付けてください。</p>
                <p style="margin-top: 20px;">
                    <a href="javascript:window.close()" style="color: white;">このウィンドウを閉じる</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // URLから認証コードを抽出
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            document.getElementById('success-section').style.display = 'none';
            document.getElementById('error-section').style.display = 'block';
            document.getElementById('error-message').textContent =
                `エラー: ${error}\n説明: ${urlParams.get('error_description') || '詳細不明'}`;
        } else if (code) {
            document.getElementById('auth-code').textContent = code;
            console.log('認証コード:', code);
        } else {
            document.getElementById('auth-code').textContent =
                '認証コードが見つかりませんでした。URLを確認してください。';
        }

        function copyCode() {
            const codeElement = document.getElementById('auth-code');
            const textArea = document.createElement('textarea');
            textArea.value = codeElement.textContent;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            const btn = document.querySelector('.copy-btn');
            const originalText = btn.textContent;
            btn.textContent = '✅ コピーしました！';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }
    </script>
</body>
</html>
