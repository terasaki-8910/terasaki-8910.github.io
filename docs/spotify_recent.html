<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify 最近再生した曲</title>

    <!-- 共有ヘッダーCSS -->
    <link rel="stylesheet" href="/header-styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0E27;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D背景コンテナ */
        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 1.2rem;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .tracks-container {
            position: relative;
            padding: 2rem 1rem;
        }

        .tracks-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;

            /* レスポンシブ対応 */
            @media (min-width: 640px) {
                grid-template-columns: repeat(2, 1fr);
            }

            @media (min-width: 1024px) {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .track-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,240,255,0.03));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,240,255,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.5s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            width: 100%;
            max-width: 400px;
            justify-self: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,240,255,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
            will-change: transform, opacity, filter;
            transform-style: preserve-3d;
            transform-origin: center center;
        }

        .track-card:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(0,240,255,0.05)) !important;
            border-color: rgba(0, 240, 255, 0.5) !important;
            box-shadow: 0 12px 48px rgba(0,0,0,0.4), 0 0 0 2px rgba(0,240,255,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        /* 宇宙的アニメーション */
        @keyframes cosmicPulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.95);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        @keyframes colorShift {
            0%, 100% {
                border-color: rgba(0, 240, 255, 0.3);
                box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1), 0 0 40px rgba(0, 240, 255, 0.2);
            }
            25% {
                border-color: rgba(112, 0, 255, 0.4);
                box-shadow: inset 0 0 20px rgba(112, 0, 255, 0.15), 0 0 40px rgba(112, 0, 255, 0.25);
            }
            50% {
                border-color: rgba(147, 51, 234, 0.4);
                box-shadow: inset 0 0 20px rgba(147, 51, 234, 0.15), 0 0 40px rgba(147, 51, 234, 0.25);
            }
            75% {
                border-color: rgba(59, 130, 246, 0.4);
                box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.15), 0 0 40px rgba(59, 130, 246, 0.25);
            }
        }

        @keyframes stardustShimmer {
            0%, 100% { opacity: 0; transform: translateX(-100%) rotate(45deg); }
            10% { opacity: 0.3; }
            20% { opacity: 0; transform: translateX(100%) rotate(45deg); }
        }

        .track-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(0, 240, 255, 0.1), transparent);
            border-radius: 18px;
            opacity: 0;
            animation: stardustShimmer 8s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        .track-card:hover::before {
            animation-duration: 3s;
            opacity: 0.6;
        }

        .track-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .album-art-container {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .album-art {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-artist {
            color: #9ca3af;
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-album {
            color: #6b7280;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .track-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .play-time {
            color: #6b7280;
            font-size: 0.8rem;
        }

        .played-at {
            color: #06b6d4;
            font-size: 0.8rem;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(6, 182, 212, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
        }

        .track-card:hover .play-button {
            opacity: 1;
        }


        .play-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Spotify iFrame Container */
        #spotify-iframe-container {
            background: transparent;
            border-radius: 12px;
            box-shadow: none;
            border: none;
            backdrop-filter: none;
            transition: all 0.3s ease;
        }

        #spotify-iframe-container:hover {
            transform: translateY(-5px);
        }

        #embed-iframe {
            border-radius: 8px;
            overflow: hidden;
        }

        /* 閉じるボタン */
        #spotify-iframe-container::before {
            content: '✕';
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        #spotify-iframe-container:hover::before {
            background: rgba(239, 68, 68, 0.8);
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        .error {
            text-align: center;
            padding: 4rem 2rem;
            color: #ef4444;
        }

        .last-updated {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #06b6d4;
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #0891b2;
        }

        /* コンテンツの上部余白を調整 */
        .container {
            padding-top: 100px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 80px 1rem 1rem;
            }

            .title {
                font-size: 2rem;
            }

            .track-card {
                width: 280px;
            }

            .album-art {
                width: 60px;
                height: 60px;
            }

            .cosmic-header__container {
                padding: 0 1rem;
            }

            .cosmic-header__home-text {
                font-size: 1rem;
            }

            .cosmic-header__spotify-box {
                padding: 0.6rem 1.2rem;
            }

            .cosmic-header__spotify-text {
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <!-- 3D背景 -->
    <div id="background-canvas"></div>

    <!-- ヘッダー -->
    <header class="cosmic-header">

    <div class="container">

        <div class="header">
            <h1 class="title">🎵 最近再生した曲</h1>
            <p class="subtitle">Spotifyで最近聴いた曲たち</p>
        </div>

        <div id="loading" class="loading">
            <p>読み込み中...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>データの読み込みに失敗しました</p>
        </div>

        <div id="content" style="display: none;">
            <div class="tracks-container">
                <div id="tracks-wrapper" class="tracks-wrapper">
                    <!-- トラックがここに挿入されます -->
                </div>
            </div>
            <div id="last-updated" class="last-updated"></div>
        </div>
    </div>

    <!-- Spotify iFrame Container -->
    <div id="spotify-iframe-container" style="position: fixed; bottom: 20px; right: 20px; width: 300px; height: 380px; z-index: 1000; display: none;">
        <div id="embed-iframe" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Spotify iFrame API -->
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script>
        // Three.js背景
        let scene, camera, renderer, particles = [], floatingObjects = [];
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        function initBackground() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('background-canvas').appendChild(renderer.domElement);

            // パーティクル
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCnt = 5000;
            const posArray = new Float32Array(particlesCnt * 3);

            for (let i = 0; i < particlesCnt * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 2000;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 2,
                color: 0x4fb3d9,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);
            particles.push(particlesMesh);

            // 浮遊オブジェクト
            for (let i = 0; i < 5; i++) {
                const geometry = new THREE.TorusKnotGeometry(20 + Math.random() * 30, 8, 100, 16);
                const material = new THREE.MeshPhongMaterial({
                    color: [0x06b6d4, 0x8b5cf6, 0x3b82f6, 0x10b981, 0xf59e0b][i],
                    emissive: [0x06b6d4, 0x8b5cf6, 0x3b82f6, 0x10b981, 0xf59e0b][i],
                    emissiveIntensity: 0.2,
                    shininess: 100,
                    specular: 0xffffff,
                    transparent: true,
                    opacity: 0.8
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(
                    (Math.random() - 0.5) * 1000,
                    (Math.random() - 0.5) * 1000,
                    (Math.random() - 0.5) * 500
                );
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                scene.add(mesh);
                floatingObjects.push(mesh);
            }

            // ライト
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x4fb3d9, 1);
            pointLight.position.set(100, 100, 250);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0x8b5cf6, 1);
            pointLight2.position.set(-100, -100, -250);
            scene.add(pointLight2);

            // イベントリスナー
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onDocumentMouseMove);

            animate();
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseMove(event) {
            mouseX = event.clientX - windowHalfX;
            mouseY = event.clientY - windowHalfY;
        }

        function animate() {
            requestAnimationFrame(animate);

            // パーティクルアニメーション
            particles.forEach(particle => {
                particle.rotation.y += 0.0005;
                particle.rotation.x += 0.0002;
            });

            // 浮遊オブジェクトアニメーション
            const time = Date.now() * 0.0005;
            floatingObjects.forEach((obj, i) => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.008;
                obj.position.y += Math.sin(time + i) * 0.5;
                obj.position.x += Math.cos(time + i) * 0.3;
            });

            // マウスインタラクション
            camera.position.x += (mouseX * 0.3 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

  
        // Spotify iFrame用の変数
        let spotifyController = null;
        let currentPlayingTrack = null;
        let iframeApiReady = false;

        // Spotify iFrame API準備完了時のコールバック
        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            console.log('✅ Spotify iFrame API準備完了');
            iframeApiReady = true;

            const element = document.getElementById('embed-iframe');
            const options = {
                uri: 'spotify:track:4K8QY8eufhwEg9EEix0Qqn', // デフォルトトラック
                width: '100%',
                height: '100%',
                theme: 'black'
            };

            const callback = (EmbedController) => {
                spotifyController = EmbedController;
                console.log('✅ Spotifyコントローラー作成完了');
            };

            IFrameAPI.createController(element, options, callback);
        };

        // 背景初期化とSpotifyデータ読み込み
        window.addEventListener('load', () => {
            initBackground();
            loadSpotifyData();
        });

        async function loadSpotifyData() {
            try {
                const response = await fetch('/spotify-data.json');
                if (!response.ok) {
                    throw new Error('データの取得に失敗しました');
                }

                const data = await response.json();
                displayTracks(data);

            } catch (error) {
                console.error('Error:', error);
                showError();
            }
        }

        function playPreview(trackElement, track) {
            // 同じ曲をクリックした場合は停止
            if (currentPlayingTrack === track.id) {
                if (spotifyController) {
                    spotifyController.pause();
                    hideSpotifyIframe();
                }
                currentPlayingTrack = null;
                updatePlayButton(trackElement, false);
                return;
            }

            // すべての再生ボタンをリセット
            document.querySelectorAll('.track-card').forEach(card => {
                updatePlayButton(card, false);
            });

            // Spotify iFrame APIが準備できているか確認
            if (!iframeApiReady || !spotifyController) {
                console.log('ℹ️ Spotify iFrame API準備中、Spotifyで開きます:', track.name);
                openInSpotify(track);
                return;
            }

            // iFrameでトラックを再生
            try {
                const trackUri = `spotify:track:${track.id}`;
                console.log('✅ iFrameで再生開始:', track.name, trackUri);

                // iFrameコンテナを表示
                showSpotifyIframe();

                // トラックをロードして再生
                spotifyController.loadUri(trackUri, () => {
                    // 少し遅延させて再生を試みる
                    setTimeout(() => {
                        spotifyController.play();
                        currentPlayingTrack = track.id;
                        updatePlayButton(trackElement, true);
                        console.log('✅ iFrame再生開始:', track.name);

                        // 再生が開始されない場合のフォールバック
                        setTimeout(() => {
                            // iFrame内の再生ボタンを探してクリック
                            const iframe = document.querySelector('#embed-iframe iframe');
                            if (iframe) {
                                try {
                                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                                    const playButton = iframeDoc.querySelector('[data-testid="play-button"], .play-button, button[aria-label*="play"]');
                                    if (playButton) {
                                        playButton.click();
                                        console.log('🎯 iFrame内再生ボタンをクリック');
                                    }
                                } catch (error) {
                                    console.log('ℹ️ iFrame内操作制限のため手動再生が必要です');
                                }
                            }
                        }, 1000);
                    }, 500);
                });

            } catch (error) {
                console.warn('⚠️ iFrame再生エラー、Spotifyで開きます:', error);
                openInSpotify(track);
            }
        }

        function showSpotifyIframe() {
            const container = document.getElementById('spotify-iframe-container');
            if (container) {
                container.style.display = 'block';
                // 閉じるボタンのイベントリスナーを追加
                container.addEventListener('click', (e) => {
                    if (e.target === container || e.target.textContent === '✕') {
                        hideSpotifyIframe();
                        if (spotifyController) {
                            spotifyController.pause();
                        }
                        currentPlayingTrack = null;
                        // すべての再生ボタンをリセット
                        document.querySelectorAll('.track-card').forEach(card => {
                            updatePlayButton(card, false);
                        });
                    }
                });
            }
        }

        function hideSpotifyIframe() {
            const container = document.getElementById('spotify-iframe-container');
            if (container) {
                container.style.display = 'none';
            }
        }

        function openInSpotify(track, trackElement = null) {
            if (trackElement) {
                updatePlayButton(trackElement, false);
            }
            currentPlayingTrack = null;
            hideSpotifyIframe();
            window.open(track.spotifyUrl, '_blank');
        }

        function updatePlayButton(trackElement, isPlaying) {
            const playButton = trackElement.querySelector('.play-button');
            const playIcon = playButton.querySelector('.play-icon');

            if (isPlaying) {
                playButton.style.background = 'rgba(239, 68, 68, 0.9)'; // 赤色に変更
                playIcon.innerHTML = '<path d="M6 4v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1H6a1 1 0 00-1 1zm6 0v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1h-2a1 1 0 00-1 1z"/>'; // 停止アイコン
            } else {
                playButton.style.background = 'rgba(6, 182, 212, 0.9)'; // シアン色に戻す
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // 再生アイコン
            }
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatPlayedAt(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));

            if (diffHours < 1) {
                return 'たった今';
            } else if (diffHours < 24) {
                return `${diffHours}時間前`;
            } else {
                const diffDays = Math.floor(diffHours / 24);
                return `${diffDays}日前`;
            }
        }

        function displayTracks(data) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');
            const wrapper = document.getElementById('tracks-wrapper');
            const lastUpdated = document.getElementById('last-updated');

            loading.style.display = 'none';
            content.style.display = 'block';

            if (!data.tracks || data.tracks.length === 0) {
                wrapper.innerHTML = '<p class="error">再生履歴がありません</p>';
                return;
            }

            wrapper.innerHTML = data.tracks.map(track => `
                <div class="track-card" data-track='${JSON.stringify(track)}'>
                    <!-- 宇宙的な発光エフェクト -->
                    <div class="cosmic-glow-effect" style="
                        position: absolute;
                        inset: 0;
                        pointer-events: none;
                        background: radial-gradient(circle at 50% 0%, rgba(0,240,255,0.1) 0%, transparent 70%);
                        animation: cosmicPulse 3s ease-in-out infinite;
                    "></div>

                    <!-- 呼吸する境界線 -->
                    <div class="cosmic-border-effect" style="
                        position: absolute;
                        inset: 0;
                        pointer-events: none;
                        border-radius: 20px;
                        border: 1px solid rgba(112,0,255,0.3);
                        animation: colorShift 4s ease-in-out infinite;
                        box-shadow: inset 0 0 20px rgba(0,240,255,0.1);
                    "></div>
                    <div class="play-button">
                        <svg class="play-icon" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                    <div class="track-header">
                        <div class="album-art-container">
                            <img src="${track.albumArt}" alt="${track.name}" class="album-art"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23333%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2212%22%3E🎵%3C/text%3E%3C/svg%3E'">
                        </div>
                        <div class="track-info">
                            <div class="track-name">${track.name}</div>
                            <div class="track-artist">${track.artist}</div>
                            <div class="track-album">${track.album}</div>
                        </div>
                    </div>
                    <div class="track-details">
                        <span class="play-time">${formatTime(track.duration)}</span>
                        <span class="played-at">${formatPlayedAt(track.playedAt)}</span>
                    </div>
                </div>
            `).join('');

            // トラックカード全体のイベントリスナーを追加
            document.querySelectorAll('.track-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const trackData = JSON.parse(this.dataset.track);
                    playPreview(this, trackData);
                });
            });

            // GSAP ScrollTriggerアニメーションを設定
            setTimeout(setupScrollAnimations, 100);

            if (data.lastUpdated) {
                const updatedDate = new Date(data.lastUpdated);
                lastUpdated.textContent = `最終更新: ${updatedDate.toLocaleString('ja-JP')}`;
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

    // リアルタイムスクロール連動アニメーション設定
    function setupScrollAnimations() {
        const trackCards = document.querySelectorAll('.track-card');
        const animationFrameRef = { current: null };

        // スクロール位置に基づいてカードスタイルを計算
        const updateCardStyles = () => {
            const viewportHeight = window.innerHeight;
            const viewportCenter = viewportHeight / 2;

            trackCards.forEach((card) => {
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.top + rect.height / 2;
                const distanceFromCenter = Math.abs(cardCenter - viewportCenter);
                const maxDistance = viewportHeight / 2;

                // 中心からの相対距離 (0 = 中心, 1 = 端)
                const normalizedDistance = Math.min(distanceFromCenter / maxDistance, 1);

                // イージング適用 (ease-out cubic)
                const easedDistance = 1 - Math.pow(1 - normalizedDistance, 3);

                // 各プロパティを計算
                const opacity = 1.0 - (easedDistance * 0.6); // 中央:1.0 -> 端:0.4
                const scale = 1.0 - (easedDistance * 0.15);  // 中央:1.0 -> 端:0.85
                const rotationX = easedDistance * 6;         // 中央:0deg -> 端:6deg
                const translateY = (cardCenter < viewportCenter ? 1 : -1) * easedDistance * 15;

                // スタイルを適用
                card.style.opacity = opacity;
                card.style.transform = `
                    scale(${scale})
                    translateY(${translateY}px)
                    rotateX(${rotationX}deg)
                    perspective(1000px)
                `;
            });

            // 次のフレームを要求
            animationFrameRef.current = requestAnimationFrame(updateCardStyles);
        };

        // スクロールイベントリスナーを設定
        const handleScroll = () => {
            if (animationFrameRef.current) {
                cancelAnimationFrame(animationFrameRef.current);
            }
            animationFrameRef.current = requestAnimationFrame(updateCardStyles);
        };

        // リサイズイベントリスナーを設定
        const handleResize = () => {
            if (animationFrameRef.current) {
                cancelAnimationFrame(animationFrameRef.current);
            }
            updateCardStyles();
        };

        // 初期スタイルを設定
        updateCardStyles();

        // イベントリスナーを登録
        window.addEventListener('scroll', handleScroll, { passive: true });
        window.addEventListener('resize', handleResize, { passive: true });

        // クリーンアップ関数を返す
        return () => {
            window.removeEventListener('scroll', handleScroll);
            window.removeEventListener('resize', handleResize);
            if (animationFrameRef.current) {
                cancelAnimationFrame(animationFrameRef.current);
            }
        };
    }

    // DOMContentLoadedイベントは削除（window loadで実行するため）

    // 5分ごとに自動更新
    setInterval(loadSpotifyData, 5 * 60 * 1000);
    </script>
</body>
