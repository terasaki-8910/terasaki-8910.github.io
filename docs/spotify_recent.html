<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify 最近再生した曲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0E27;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D背景コンテナ */
        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 1.2rem;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .tracks-container {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 2rem 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }

        .tracks-container::-webkit-scrollbar {
            height: 8px;
        }

        .tracks-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .tracks-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .tracks-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .tracks-wrapper {
            display: flex;
            gap: 1.5rem;
            padding: 0 1rem;
            min-width: max-content;
        }

        .track-card {
            flex-shrink: 0;
            width: 320px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .track-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .track-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .album-art {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-artist {
            color: #9ca3af;
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-album {
            color: #6b7280;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .track-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .play-time {
            color: #6b7280;
            font-size: 0.8rem;
        }

        .played-at {
            color: #06b6d4;
            font-size: 0.8rem;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(6, 182, 212, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .track-card:hover .play-button {
            opacity: 1;
        }

        .play-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        .error {
            text-align: center;
            padding: 4rem 2rem;
            color: #ef4444;
        }

        .last-updated {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #06b6d4;
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #0891b2;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .title {
                font-size: 2rem;
            }

            .track-card {
                width: 280px;
            }

            .album-art {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- 3D背景 -->
    <div id="background-canvas"></div>

    <div class="container">
        <a href="/" class="back-link">
            ← ホームに戻る
        </a>

        <div class="header">
            <h1 class="title">🎵 最近再生した曲</h1>
            <p class="subtitle">Spotifyで最近聴いた曲たち</p>
        </div>

        <div id="loading" class="loading">
            <p>読み込み中...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>データの読み込みに失敗しました</p>
        </div>

        <div id="content" style="display: none;">
            <div class="tracks-container">
                <div id="tracks-wrapper" class="tracks-wrapper">
                    <!-- トラックがここに挿入されます -->
                </div>
            </div>
            <div id="last-updated" class="last-updated"></div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js背景
        let scene, camera, renderer, particles = [], floatingObjects = [];
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        function initBackground() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('background-canvas').appendChild(renderer.domElement);

            // パーティクル
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCnt = 5000;
            const posArray = new Float32Array(particlesCnt * 3);

            for (let i = 0; i < particlesCnt * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 2000;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 2,
                color: 0x4fb3d9,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);
            particles.push(particlesMesh);

            // 浮遊オブジェクト
            for (let i = 0; i < 5; i++) {
                const geometry = new THREE.TorusKnotGeometry(20 + Math.random() * 30, 8, 100, 16);
                const material = new THREE.MeshPhongMaterial({
                    color: [0x06b6d4, 0x8b5cf6, 0x3b82f6, 0x10b981, 0xf59e0b][i],
                    emissive: [0x06b6d4, 0x8b5cf6, 0x3b82f6, 0x10b981, 0xf59e0b][i],
                    emissiveIntensity: 0.2,
                    shininess: 100,
                    specular: 0xffffff,
                    transparent: true,
                    opacity: 0.8
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(
                    (Math.random() - 0.5) * 1000,
                    (Math.random() - 0.5) * 1000,
                    (Math.random() - 0.5) * 500
                );
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                scene.add(mesh);
                floatingObjects.push(mesh);
            }

            // ライト
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x4fb3d9, 1);
            pointLight.position.set(100, 100, 250);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0x8b5cf6, 1);
            pointLight2.position.set(-100, -100, -250);
            scene.add(pointLight2);

            // イベントリスナー
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onDocumentMouseMove);

            animate();
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseMove(event) {
            mouseX = event.clientX - windowHalfX;
            mouseY = event.clientY - windowHalfY;
        }

        function animate() {
            requestAnimationFrame(animate);

            // パーティクルアニメーション
            particles.forEach(particle => {
                particle.rotation.y += 0.0005;
                particle.rotation.x += 0.0002;
            });

            // 浮遊オブジェクトアニメーション
            const time = Date.now() * 0.0005;
            floatingObjects.forEach((obj, i) => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.008;
                obj.position.y += Math.sin(time + i) * 0.5;
                obj.position.x += Math.cos(time + i) * 0.3;
            });

            // マウスインタラクション
            camera.position.x += (mouseX * 0.3 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        // プレビュー再生用の変数
        let currentPlayingTrack = null;
        let currentAudio = null;

        // 背景初期化とSpotifyデータ読み込み
        window.addEventListener('load', () => {
            initBackground();
            loadSpotifyData();
        });

        async function loadSpotifyData() {
            try {
                const response = await fetch('/spotify-data.json');
                if (!response.ok) {
                    throw new Error('データの取得に失敗しました');
                }

                const data = await response.json();
                displayTracks(data);

            } catch (error) {
                console.error('Error:', error);
                showError();
            }
        }

        function playPreview(trackElement, track) {
            // 同じ曲をクリックした場合は停止
            if (currentPlayingTrack === track.id) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                currentPlayingTrack = null;
                updatePlayButton(trackElement, false);
                return;
            }

            // 現在再生中の曲があれば停止
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            // すべての再生ボタンをリセット
            document.querySelectorAll('.track-card').forEach(card => {
                updatePlayButton(card, false);
            });

            // プレビューURLがある場合は直接再生を試みる
            if (track.previewUrl && track.previewUrl.trim() !== '') {
                try {
                    // シンプルなAudioオブジェクト作成
                    const audio = new Audio(track.previewUrl);
                    audio.volume = 0.7;

                    // 再生試行
                    const playPromise = audio.play();

                    if (playPromise !== undefined) {
                        // 現代ブラウザの場合
                        playPromise.then(() => {
                            currentAudio = audio;
                            currentPlayingTrack = track.id;
                            updatePlayButton(trackElement, true);
                            console.log('✅ プレビュー再生開始:', track.name);

                            // 再生終了時の処理
                            audio.addEventListener('ended', () => {
                                currentAudio = null;
                                currentPlayingTrack = null;
                                updatePlayButton(trackElement, false);
                                console.log('✅ プレビュー再生完了:', track.name);
                            });
                        }).catch(error => {
                            console.log('ℹ️ 自動再生ブロック、手動再生を試みます:', track.name);
                            // ユーザーインタラクションを待機して再生
                            attemptManualPlayback(trackElement, track, audio);
                        });
                    } else {
                        // レガシーブラウザの場合
                        audio.addEventListener('ended', () => {
                            currentAudio = null;
                            currentPlayingTrack = null;
                            updatePlayButton(trackElement, false);
                            console.log('✅ プレビュー再生完了:', track.name);
                        });

                        currentAudio = audio;
                        currentPlayingTrack = track.id;
                        updatePlayButton(trackElement, true);
                        console.log('✅ プレビュー再生開始:', track.name);
                    }

                } catch (error) {
                    console.warn('⚠️ プレビュー再生エラー、Spotifyで開きます:', error);
                    openInSpotify(track);
                }
            } else {
                // プレビューURLがない場合はSpotifyで開く
                console.log('ℹ️ プレビューURLがありません、Spotifyで開きます:', track.name);
                openInSpotify(track);
            }
        }

        function attemptManualPlayback(trackElement, track, audio) {
            // ユーザーアラクション用のUI表示
            const playPrompt = document.createElement('div');
            playPrompt.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(6, 182, 212, 0.95);
                color: white;
                padding: 20px 30px;
                border-radius: 12px;
                text-align: center;
                z-index: 1000;
                font-size: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            playPrompt.innerHTML = `
                <div style="margin-bottom: 15px;">
                    🎵 「${track.name}」のプレビュー再生
                </div>
                <button id="manual-play-btn" style="
                    background: white;
                    color: #06b6d4;
                    border: none;
                    padding: 8px 20px;
                    border-radius: 6px;
                    font-size: 14px;
                    cursor: pointer;
                    margin-right: 10px;
                ">再生する</button>
                <button id="skip-spotify-btn" style="
                    background: rgba(255, 255, 255, 0.2);
                    color: white;
                    border: 1px solid white;
                    padding: 8px 20px;
                    border-radius: 6px;
                    font-size: 14px;
                    cursor: pointer;
                ">キャンセル</button>
            `;

            document.body.appendChild(playPrompt);

            // イベントリスナー
            document.getElementById('manual-play-btn').addEventListener('click', () => {
                try {
                    audio.play().then(() => {
                        currentAudio = audio;
                        currentPlayingTrack = track.id;
                        updatePlayButton(trackElement, true);
                        playPrompt.remove();
                        console.log('✅ 手動でプレビュー再生開始:', track.name);

                        audio.addEventListener('ended', () => {
                            currentAudio = null;
                            currentPlayingTrack = null;
                            updatePlayButton(trackElement, false);
                            console.log('✅ プレビュー再生完了:', track.name);
                        });
                    }).catch(error => {
                        console.warn('⚠️ 手動再生も失敗、Spotifyで開きます:', error);
                        playPrompt.remove();
                        openInSpotify(track);
                    });
                } catch (error) {
                    console.warn('⚠️ 手動再生エラー、Spotifyで開きます:', error);
                    playPrompt.remove();
                    openInSpotify(track);
                }
            });

            document.getElementById('skip-spotify-btn').addEventListener('click', () => {
                playPrompt.remove();
                openInSpotify(track);
            });

            // 10秒後に自動でキャンセル
            setTimeout(() => {
                if (playPrompt.parentNode) {
                    playPrompt.remove();
                }
            }, 10000);
        }

        function openInSpotify(track) {
            updatePlayButton(trackElement, false);
            currentAudio = null;
            currentPlayingTrack = null;
            window.open(track.spotifyUrl, '_blank');
        }

        function updatePlayButton(trackElement, isPlaying) {
            const playButton = trackElement.querySelector('.play-button');
            const playIcon = playButton.querySelector('.play-icon');

            if (isPlaying) {
                playButton.style.background = 'rgba(239, 68, 68, 0.9)'; // 赤色に変更
                playIcon.innerHTML = '<path d="M6 4v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1H6a1 1 0 00-1 1zm6 0v16a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1h-2a1 1 0 00-1 1z"/>'; // 停止アイコン
            } else {
                playButton.style.background = 'rgba(6, 182, 212, 0.9)'; // シアン色に戻す
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // 再生アイコン
            }
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatPlayedAt(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));

            if (diffHours < 1) {
                return 'たった今';
            } else if (diffHours < 24) {
                return `${diffHours}時間前`;
            } else {
                const diffDays = Math.floor(diffHours / 24);
                return `${diffDays}日前`;
            }
        }

        function displayTracks(data) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');
            const wrapper = document.getElementById('tracks-wrapper');
            const lastUpdated = document.getElementById('last-updated');

            loading.style.display = 'none';
            content.style.display = 'block';

            if (!data.tracks || data.tracks.length === 0) {
                wrapper.innerHTML = '<p class="error">再生履歴がありません</p>';
                return;
            }

            wrapper.innerHTML = data.tracks.map(track => `
                <div class="track-card" data-track='${JSON.stringify(track)}'>
                    <div class="track-header">
                        <img src="${track.albumArt}" alt="${track.name}" class="album-art"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23333%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2212%22%3E🎵%3C/text%3E%3C/svg%3E'">
                        <div class="track-info">
                            <div class="track-name">${track.name}</div>
                            <div class="track-artist">${track.artist}</div>
                            <div class="track-album">${track.album}</div>
                        </div>
                    </div>
                    <div class="play-button" style="pointer-events: auto; cursor: pointer;">
                        <svg class="play-icon" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                    <div class="track-details">
                        <span class="play-time">${formatTime(track.duration)}</span>
                        <span class="played-at">${formatPlayedAt(track.playedAt)}</span>
                    </div>
                </div>
            `).join('');

            // 再生ボタンのイベントリスナーを追加
            document.querySelectorAll('.track-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    const trackData = JSON.parse(this.dataset.track);
                    playPreview(this, trackData);
                });
            });

            if (data.lastUpdated) {
                const updatedDate = new Date(data.lastUpdated);
                lastUpdated.textContent = `最終更新: ${updatedDate.toLocaleString('ja-JP')}`;
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // DOMContentLoadedイベントは削除（window loadで実行するため）

        // 5分ごとに自動更新
        setInterval(loadSpotifyData, 5 * 60 * 1000);
    </script>
</body>
</html>
