name: Update Spotify Recently Played

on:
  schedule:
    # 6時間ごとに実行 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 手動実行も可能
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-spotify.yml'
      - 'scripts/update-spotify.js'

jobs:
  update-spotify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Update Spotify data
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/update-spotify.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "🎵 Update Spotify recently played tracks

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: GitHub Action <action@users.noreply.github.com>"
          git push