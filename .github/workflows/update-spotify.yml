name: Update Spotify Recently Played

on:
  schedule:
    # 6時間ごとに実行 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 手動実行も可能
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-spotify.yml'
      - 'scripts/update-spotify.js'

jobs:
  update-spotify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Update Spotify data
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/update-spotify.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🎵 Update Spotify recently played tracks

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: GitHub Action <action@users.noreply.github.com>"
          # 他のワークフロー(Steam等、同じ間隔で並走しうる)が先にpushしていた
          # 場合に備えてリトライする。単純なgit push一発だと非fast-forwardで
          # 失敗し、そのままこの回の更新が消えていた(2026-08-18、Steam連携
          # 追加後に実際に発生・再現)。
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push失敗、pull --rebaseしてリトライ ($i/5)"
            git pull --rebase origin main
            sleep $((i * 3))
          done
          echo "5回リトライしてもpushできませんでした"
          exit 1