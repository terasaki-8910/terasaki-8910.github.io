name: Update Gomi Calendar

on:
  schedule:
    # 毎週月曜 6:00 JST (日曜 21:00 UTC)。市の更新は年度単位だが、
    # 年度替わりのリンク差し替えに自動追従するため週次で確認する
    - cron: '0 21 * * 0'
  workflow_dispatch: # 手動実行も可能
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-gomi.yml'
      - 'scripts/update-gomi-calendar.js'

jobs:
  update-gomi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # deploy.yml を呼ぶ(下の Deploy the updated data)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Update gomi calendar data
        run: node scripts/update-gomi-calendar.js

      - name: Commit and push changes
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/gomi-tsukuba
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🗑️ Update gomi calendar data"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN での push では deploy.yml が動かない(GitHub の仕様。workflow_dispatch だけは動く)。
      # 新しいデータを本番(Cloudflare Pages)に出すため、push できたときだけここで呼ぶ
      - name: Deploy the updated data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
