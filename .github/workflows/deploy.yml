name: Deploy (Cloudflare Pages + GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # 本番は Cloudflare Pages(https://fuyuiro.pages.dev。2026-10-12 確認シート20回目 R20-2・R20-3)。
      # ビルドはここ(全履歴つきの checkout。更新履歴のグラフに要る)で済ませ、出来上がった docs/ をそのまま送る(Direct Upload)。
      # トークンとアカウント ID は GitHub Secrets にだけ置く。
      # プロジェクトは初回だけ作る(2回目からは「もうある」で失敗するので、その失敗は無視して次の送る手順で確かめる)
      - name: Create Cloudflare Pages project (first time only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create fuyuiro --production-branch=main || echo "skipped (the project already exists, or it could not be created)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy docs --project-name=fuyuiro --branch=main --commit-dirty=true

      # GitHub Pages(旧 URL https://terasaki-8910.github.io)は、新しい URL への転送ページにする(scripts/build-redirect-site.mjs)。
      # ただし Pages の公開元が「GitHub Actions」のときだけ。「main の /docs」のままだと、/docs の中身の公開と取り合いになるので、
      # そのあいだは今までどおり docs/ を送る(公開元の切り替えは本人が Settings → Pages で行う)
      - name: Choose what GitHub Pages serves
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          echo "GitHub Pages build_type: $mode"
          if [ "$mode" = "workflow" ]; then
            node scripts/build-redirect-site.mjs
            echo "path=./redirect-site" >> "$GITHUB_OUTPUT"
          else
            echo "path=./docs" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
