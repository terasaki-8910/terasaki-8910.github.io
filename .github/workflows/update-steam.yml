name: Update Steam Data

on:
  schedule:
    # 6時間ごとに実行 (UTC)。Spotify(0分)と同時に走るとpushが衝突するため
    # 5分ずらしてある(git push自体もリトライするようにしたので必須ではないが、
    # 衝突頻度を下げておく)。
    - cron: '5 */6 * * *'
  workflow_dispatch: # 手動実行も可能
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-steam.yml'
      - 'scripts/update-steam.js'

jobs:
  update-steam:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # deploy.yml を呼ぶ(下の Deploy the updated data)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Update Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/update-steam.js

      - name: Commit and push changes
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🎮 Update Steam data

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: GitHub Action <action@users.noreply.github.com>"
          # 他のワークフロー(Spotify等、同じ間隔で並走しうる)が先にpushして
          # いた場合に備えてリトライする。単純なgit push一発だと非fast-forward
          # で失敗し、そのままこの回の更新が消えていた(2026-08-18、実際に
          # 発生・再現)。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push失敗、pull --rebaseしてリトライ ($i/5)"
            git pull --rebase origin main
            sleep $((i * 3))
          done
          echo "5回リトライしてもpushできませんでした"
          exit 1

      # GITHUB_TOKEN での push では deploy.yml が動かない(GitHub の仕様。workflow_dispatch だけは動く)。
      # 新しいデータを本番(Cloudflare Pages)に出すため、push できたときだけここで呼ぶ
      - name: Deploy the updated data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
