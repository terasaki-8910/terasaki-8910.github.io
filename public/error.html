<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エラー - クソサイト製造工場</title>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: linear-gradient(to bottom, #0A0E27, #151B36);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .error-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid rgba(239, 68, 68, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    p {
      font-size: 1.25rem;
      color: #9CA3AF;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 50px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #00D9FF;
      color: #0A0E27;
    }

    .btn-primary:hover {
      background: #00b8d4;
      transform: scale(1.05);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .help-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 30px;
      margin-top: 30px;
    }

    .help-box h3 {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .help-box ul {
      text-align: left;
      color: #9CA3AF;
      line-height: 1.8;
      list-style: none;
      max-width: 400px;
      margin: 0 auto;
    }

    .help-box li {
      margin-bottom: 8px;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.875rem;
      color: #6B7280;
    }

    @media (min-width: 640px) {
      .buttons {
        flex-direction: row;
        justify-content: center;
      }

      h1 {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-icon">💥</div>
    
    <h1>エラーが発生しました</h1>
    
    <p>申し訳ございません。予期しないエラーが発生しました。</p>

    <div class="buttons">
      <button class="btn btn-primary" onclick="window.location.reload()">
        ページを再読み込み
      </button>
      
      <a href="/" class="btn btn-secondary">
        ホームに戻る
      </a>
    </div>

    <div class="help-box">
      <h3>問題が解決しない場合</h3>
      <ul>
        <li>• ブラウザのキャッシュをクリアしてみてください</li>
        <li>• 別のブラウザで試してみてください</li>
        <li>• ハードウェアアクセラレーションを有効にしてください</li>
        <li>• しばらく時間をおいて再度アクセスしてください</li>
      </ul>
    </div>

    <div class="footer">
      © 2024 クソサイト製造工場
    </div>
  </div>

  <script>
    // エラー情報をコンソールに出力
    console.log('Error page loaded at:', new Date().toISOString())
    
    // URLパラメータからエラー情報を取得
    const urlParams = new URLSearchParams(window.location.search)
    const errorMessage = urlParams.get('error')
    if (errorMessage) {
      console.error('Error details:', errorMessage)
    }
  </script>
</body>
</html>
